<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>

<script>
(function(){
  const FIRST_OPEN_KEY='politica_first_open_done';
  function isFirstOpen(){try{return !localStorage.getItem(FIRST_OPEN_KEY);}catch(e){return true;}}
  const origFetch=window.fetch;
  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:(input&&input.url)?input.url:'';
    const isFeed=url.includes('rss2json.com')||url.includes('allorigins.win');
    if(!isFeed)return origFetch.apply(this,arguments);
    try{
      const resp=await origFetch.apply(this,arguments);
      if(isFirstOpen()){
        try{localStorage.setItem(FIRST_OPEN_KEY,'1');}catch(e){}
      }
      return resp;
    }catch(e){throw e;}
  };
})();
</script>

<script>
(function(){
  var aberta=false;
  function getGridESecao(){
    var result={grid:null,tituloOriginal:null,secao:null};
    document.querySelectorAll('section.mt-16').forEach(function(sec){
      var h2=sec.querySelector('h2');
      if(h2 && h2.textContent.includes('VEÍCULOS MONITORADOS')){
        var grid=sec.querySelector('div.mt-4.grid');
        if(grid){result.grid=grid;result.tituloOriginal=h2.closest('div.flex');result.secao=sec;}
      }
    });
    if(!result.grid){
      document.querySelectorAll('div.mt-4.grid.grid-cols-2').forEach(function(g){
        if(g.innerHTML.includes('g1.globo.com/politica')){result.grid=g;result.secao=g.closest('section');result.tituloOriginal=result.secao?result.secao.querySelector('div.flex'):null;}
      });
    }
    return result;
  }
  function aplicarSimp(){
    var r=getGridESecao();if(!r.grid)return;
    if(!r.grid.classList.contains('grid-veiculos-simp'))r.grid.classList.add('grid-veiculos-simp');
    if(aberta){r.grid.classList.remove('oculto-simp');r.grid.classList.add('visivel-simp');}
    else{r.grid.classList.add('oculto-simp');r.grid.classList.remove('visivel-simp');}
    var btn=document.getElementById('btn-simplificada');if(btn)btn.textContent=aberta?'OCULTAR VEÍCULOS MONITORADOS ▲':'MOSTRAR VEÍCULOS MONITORADOS ▼';
  }
  function criarBarraSimp(){
    if(document.getElementById('barra-simplificada'))return;
    var r=getGridESecao();if(!r.grid)return;
    if(r.tituloOriginal)r.tituloOriginal.classList.add('titulo-original-duplicado');
    var barra=document.createElement('div');barra.id='barra-simplificada';
    barra.innerHTML='<div class="linha-titulo">VEÍCULOS MONITORADOS <span class="sub">18/32 FONTES • FILTRAGEM 100% POLÍTICA</span></div><button id="btn-simplificada">MOSTRAR VEÍCULOS MONITORADOS ▼</button>';
    r.grid.parentElement.insertBefore(barra,r.grid);
    document.getElementById('btn-simplificada').onclick=function(){aberta=!aberta;aplicarSimp();};
  }
  function initSimp(){criarBarraSimp();setTimeout(function(){var r=getGridESecao();if(r.grid){r.grid.classList.add('grid-veiculos-simp','oculto-simp');}aplicarSimp();},500);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initSimp);else initSimp();
  setTimeout(initSimp,1000);setTimeout(initSimp,2500);
})();
</script>

<script>
(function(){
  // Esconder todos os botões de atualizar
  function hideUpdateButtons(){
    document.querySelectorAll('[data-testid^="btn-atualizar"]').forEach(b=>{b.style.display='none'; b.classList.add('btn-atualizar-hidden');});
    document.querySelectorAll('button').forEach(btn=>{
      const txt = (btn.textContent||'').toLowerCase();
      if(txt.includes('atualizar agora') || txt.includes('atualizar')){
        if(btn.textContent.trim().length < 30){ // evitar esconder outros
          btn.style.display='none';
        }
      }
    });
  }
  setInterval(hideUpdateButtons, 1000);
  hideUpdateButtons();

  // Criar overlay de loading quando não há notícias
  function ensureLoading(){
    const briefingContainers = document.querySelectorAll('.mt-6.flex.flex-col.gap-3');
    briefingContainers.forEach(container=>{
      if(container.querySelector('.polis-loading-overlay')) return;
      if(container.children.length===0 || container.querySelectorAll('[class*="rounded-[18px]"]').length===0){
        const overlay = document.createElement('div');
        overlay.className = 'polis-loading-overlay';
        overlay.innerHTML = '<div class="polis-loading-card">Apurando principais notícias...</div><div class="polis-loading-card">Coletando dos veículos em tempo real...</div><div class="polis-loading-card">Organizando linha do tempo...</div>';
        container.appendChild(overlay);
      }
    });
    // Verificar se já tem conteúdo para esconder loading
    document.querySelectorAll('.polis-loading-overlay').forEach(overlay=>{
      const parent = overlay.parentElement;
      const hasCards = parent && parent.querySelectorAll('[class*="rounded-[18px]"]').length>0;
      if(hasCards){
        overlay.style.display='none';
      } else {
        overlay.style.display='flex';
      }
    });
  }
  setInterval(ensureLoading, 800);
  document.addEventListener('DOMContentLoaded', ensureLoading);
})();
</script>

    if(txt.indexOf('Conteúdo postado por') !== -1) return true;
    if(txt.indexOf('Publicado em') !== -1 && txt.indexOf('Gouveia') !== -1) return true;
    if(txt.indexOf('Crédito: Reprodução') !== -1) return true;
    if(txt.indexOf('Assine a newsletter') !== -1) return true;
    if(txt.indexOf('Entre no canal do 247') !== -1) return true;
    if(txt.indexOf('Apoie o 247') !== -1) return true;
    if(txt.indexOf('![Image') !== -1 && txt.indexOf('Laís Gouveia') !== -1) return true;
    if(txt.indexOf('#amenu') !== -1) return true;
    if(txt.indexOf('[Ir para') === 0) return true;
    if(txt.indexOf('Disponível em') === 0) return true;
    if(txt.indexOf('(http://') === 0) return true;
    if(txt.indexOf('![') === 0) return true;
    if(txt === 'Poder360') return true;
    if(txt.indexOf('Pushnews') !== -1) return true;
    if(txt.indexOf('ENTRAR NO CANAL') !== -1) return true;
    if(txt.indexOf('TV Ao Vivo') !== -1) return true;
    if(txt.indexOf('Jornal da Manhã') !== -1) return true;
    if(/\d{2}h\d{2}\s*-\s*\d{2}h\d{2}/.test(txt) && txt.length < 150) return true;
    return false;
  }
  
  function ehLixo(txt){
    if(!txt) return true;
    if(txt.length < 45) return true;
    if(ehIrrelevanteDefinitivo(txt)) return true;
    return false;
  }
  
  function ehFim(txt){
    if(!txt) return false;
    var l = txt.toLowerCase();
    if(l.indexOf('siga') !== -1 && l.indexOf('entrar no canal') !== -1) return true;
    if(l.indexOf('siga nas redes') !== -1) return true;
    if(l.indexOf('acompanhe nas redes') !== -1) return true;
    if(l.indexOf('nos siga') !== -1) return true;
    if(l.indexOf('tags:') === 0) return true;
    if(txt.indexOf('Pólis • Curadoria') !== -1) return true;
    return false;
  }
  
  function ehRedundante(texto, titulo, subtitulo){
    if(!texto) return true;
    var tNorm = normalizar(texto);
    var tituloNorm = titulo ? normalizar(titulo) : '';
    var subNorm = subtitulo ? normalizar(subtitulo) : '';
    if(tituloNorm && tNorm === tituloNorm) return true;
    if(tituloNorm && tNorm.indexOf(tituloNorm) !== -1 && texto.length < titulo.length + 30) return true;
    if(subNorm && tNorm === subNorm) return true;
    if(subNorm && subNorm.indexOf(tNorm.substring(0,40)) !== -1 && texto.length < 350) return true;
    return false;
  }
  
  function extrair(md, titulo, subtitulo){
    try{
      var linhas = md.split('\n');
      var blocos = [];
      var buf = '';
      for(var i=0;i<linhas.length;i++){
        var linha = (linhas[i]||'').trim();
        if(!linha){
          if(buf.length > 50){
            var c = limpar(buf);
            if(ehFim(c)) break;
            if(c.toLowerCase().indexOf('title:') === 0) { buf=''; continue; }
            if(ehIrrelevanteDefinitivo(c)) { buf=''; continue; }
            if(ehRedundante(c, titulo, subtitulo)) { buf=''; continue; }
            if(c.length >= 50 && !ehLixo(c)) blocos.push(c);
          }
          buf='';
          continue;
        }
        if(ehLixo(linha) || ehIrrelevanteDefinitivo(linha)){ if(ehFim(linha)) break; continue; }
        if(linha.toLowerCase().indexOf('title:') === 0) continue;
        if(ehFim(linha)) break;
        if(linha.length < 10) continue;
        if(linha.indexOf('![') === 0) continue;
        if(linha.toLowerCase().indexOf('compartilhe') !== -1) continue;
        if(linha.indexOf('mailto:?') !== -1) continue;
        if(linha.indexOf('[') === 0 && linha.indexOf('](') !== -1){
          if(ehIrrelevanteDefinitivo(linha)) continue;
          var m = linha.match(/\[([^\]]+)\]/);
          if(m){ var inner = m[1].trim(); if(ehIrrelevanteDefinitivo(inner)) continue; linha = inner; } else continue;
        }
        if(linha.indexOf('#') === 0){
          linha = linha.replace(/^#+\s*/, '').trim();
          if(ehFim(linha)) break;
          if(linha.toLowerCase().indexOf('title:') === 0) continue;
          if(ehIrrelevanteDefinitivo(linha)) continue;
          if(ehRedundante(linha, titulo, subtitulo)) continue;
          if(linha.length >= 12 && linha.length <= 250 && !ehLixo(linha)){
            if(buf.length > 50){
              var c2 = limpar(buf);
              if(c2.length >= 50 && !ehLixo(c2) && !ehIrrelevanteDefinitivo(c2) && !ehRedundante(c2, titulo, subtitulo)) blocos.push(c2);
              buf='';
            }
            blocos.push(linha);
          }
          continue;
        }
        if(ehFim(linha)) break;
        buf += ' ' + linha;
        if(buf.length > 900){
          var c3 = limpar(buf);
          if(ehFim(c3)) break;
          if(c3.toLowerCase().indexOf('title:') === 0) { buf=''; continue; }
          if(ehIrrelevanteDefinitivo(c3)) { buf=''; continue; }
          if(ehRedundante(c3, titulo, subtitulo)) { buf=''; continue; }
          if(c3.length >= 50 && !ehLixo(c3)) blocos.push(c3);
          buf='';
        }
      }
      if(buf.length > 50){
        var c4 = limpar(buf);
        if(c4.toLowerCase().indexOf('title:') !== 0 && !ehFim(c4) && !ehLixo(c4) && !ehIrrelevanteDefinitivo(c4) && !ehRedundante(c4, titulo, subtitulo)){
          blocos.push(c4);
        }
      }
      var limpos = [];
      var vistos = {};
      for(var j=0;j<blocos.length;j++){
        var b = blocos[j];
        if(ehFim(b)) break;
        if(b.toLowerCase().indexOf('title:') === 0) continue;
        if(ehIrrelevanteDefinitivo(b)) continue;
        if(ehRedundante(b, titulo, subtitulo)) continue;
        var chave = b.substring(0,45).toLowerCase();
        if(vistos[chave]) continue;
        vistos[chave]=true;
        var semLink = b.replace(/https?:\/\/[^\s]+/g,'').replace(/\(https?:\/\/[^)]+\)/g,'').replace(/\s+/g,' ').trim();
        if(semLink.length >= 50 && !ehFim(semLink) && !ehIrrelevanteDefinitivo(semLink) && !ehRedundante(semLink, titulo, subtitulo)){
          limpos.push(semLink);
        }
      }
      while(limpos.length > 0 && (ehRedundante(limpos[0], titulo, subtitulo) || ehIrrelevanteDefinitivo(limpos[0]))){
        limpos.shift();
      }
      return limpos;
    }catch(e){ return []; }
  }
  
  async function buscar(url, titulo, subtitulo){
    var tentativas = [
      'https://r.jina.ai/http://' + url.replace(/^https?:\/\//,''),
      'https://r.jina.ai/https://' + url.replace(/^https?:\/\//,''),
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
    ];
    for(var t=0;t<tentativas.length;t++){
      try{
        var r = await fetch(tentativas[t]);
        if(!r.ok) continue;
        var txt = await r.text();
        if(!txt || txt.length < 400) continue;
        if(txt.indexOf('403 Forbidden') !== -1) continue;
        var blocos = extrair(txt, titulo, subtitulo);
        if(blocos.length >= 1) return blocos;
      }catch(e){}
    }
    return null;
  }
  
  // === CARREGANDO SIMPLIFICADO - sem duplicação ===
  function criarLoading(container){
    // Remove todos os loadings antigos para não duplicar
    var todos = document.querySelectorAll('#polis-loading-simples, #polis-loading-final, #polis-loading, #polis-integra, #polis-integra-final, #polis-final-limpo, #polis-sem-irrelevante');
    for(var i=0;i<todos.length;i++){
      if(todos[i].id.indexOf('loading') !== -1) todos[i].remove();
    }
    if(container.parentNode.querySelector('#polis-loading-simples')) return;
    
    var loading = document.createElement('div');
    loading.id = 'polis-loading-simples';
    // Simplificado: sem caixa, sem borda, apenas texto pequeno igual ao card
    loading.style.cssText = 'margin:12px 0;padding:0;color:#71717a;font-size:12px;opacity:0.8;';
    loading.textContent = 'Carregando...';
    container.parentNode.insertBefore(loading, container.nextSibling);
  }
  
  function removerLoading(dialog){
    var els = dialog.querySelectorAll('#polis-loading-simples, #polis-loading-final, #polis-loading');
    for(var i=0;i<els.length;i++) els[i].remove();
  }
  
  async function carregar(url, container, dialog){
    if(!url) return;
    if(dialog.querySelector('#polis-final-limpo')) return;
    if(dialog.querySelector('#polis-loading-simples')) return;
    
    var titulo = '';
    var subtitulo = '';
    var h1 = dialog.querySelector('h1');
    if(h1) titulo = limpar(h1.textContent);
    var allDivs = dialog.querySelectorAll('div');
    for(var i=0;i<allDivs.length;i++){
      var txt = limpar(allDivs[i].textContent);
      if(txt.length > 40 && txt.length < 500){
        if(txt.indexOf('O levantamento do Real Time Big Data') !== -1){ subtitulo = txt; break; }
        if(txt.indexOf('As imagens são de uma câmera') !== -1){ subtitulo = txt; break; }
      }
    }
    
    if(cache[url]){
      removerLoading(dialog);
      mostrar(cache[url], container, dialog);
      return;
    }
    
    criarLoading(container);
    container.style.display='none';
    
    var blocos = await buscar(url, titulo, subtitulo);
    removerLoading(dialog);
    
    if(!blocos || blocos.length === 0){
      container.style.display='';
      return;
    }
    
    cache[url] = blocos;
    mostrar(blocos, container, dialog);
  }
  
  function mostrar(blocos, container, dialog){
    var oldIds = ['#polis-final-limpo','#polis-sem-irrelevante','#polis-sem-redundancia','#polis-integra','#polis-integra-final','#polis-integra-fora','#polis-loading-simples','#polis-loading-final','#polis-loading'];
    for(var o=0;o<oldIds.length;o++){
      var els = dialog.querySelectorAll(oldIds[o]);
      for(var e=0;e<els.length;e++) els[e].remove();
    }
    
    var wrap = document.createElement('div');
    wrap.id = 'polis-final-limpo';
    wrap.style.cssText = 'margin:16px 0 0 0;padding:0;';
    
    var html = '';
    for(var i=0;i<blocos.length;i++){
      html += '<p style="margin-bottom:16px;line-height:1.65;color:#d4d4d8;font-size:15px;font-family:Georgia, serif;">' + blocos[i].replace(/</g,'&lt;') + '</p>';
    }
    
    wrap.innerHTML = html;
    container.parentNode.insertBefore(wrap, container.nextSibling);
    container.style.display='none';
  }
  
  function processar(dialog){
    try{
      var container = dialog.querySelector('div.mt-6.flex.flex-col.gap-4');
      if(!container){
        var divs = dialog.querySelectorAll('div');
        for(var i=0;i<divs.length;i++){
          if(divs[i].textContent && divs[i].textContent.indexOf('Apuração em tempo real via') !== -1){
            container = divs[i].parentElement;
            break;
          }
        }
      }
      if(!container) return;
      if(dialog.querySelector('#polis-final-limpo')){
        container.style.display='none';
        var load = dialog.querySelector('#polis-loading-simples');
        if(load) load.remove();
        return;
      }
      
      var url = null;
      var divs2 = dialog.querySelectorAll('div');
      for(var j=0;j<divs2.length;j++){
        if(divs2[j].textContent && divs2[j].textContent.indexOf('LINK OFICIAL') !== -1){
          var sec = divs2[j].closest('.mt-8');
          if(sec){
            var links = sec.querySelectorAll('a[href^="http"]');
            if(links.length>0) url = links[0].href;
          }
          break;
        }
      }
      if(!url){
        var fl = dialog.querySelector('.border-t a[href^="http"]');
        if(fl) url = fl.href;
      }
      if(url) carregar(url, container, dialog);
    }catch(e){}
  }
  
  var obs = new MutationObserver(function(muts){
    for(var i=0;i<muts.length;i++){
      for(var j=0;j<muts[i].addedNodes.length;j++){
        var node = muts[i].addedNodes[j];
        if(node.nodeType===1){
          var dlg = node.getAttribute && node.getAttribute('role')==='dialog' ? node : (node.querySelector ? node.querySelector('[role="dialog"]') : null);
          if(dlg) setTimeout(function(d){ return function(){ processar(d); }; }(dlg), 400);
        }
      }
    }
  });
  obs.observe(document.body, {childList:true, subtree:true});
  setInterval(function(){
    var dlg = document.querySelector('[role="dialog"]');
    if(dlg) processar(dlg);
  }, 1000);
})();
</script>
